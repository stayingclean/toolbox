name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master
  # Die Anleitungsseiten kommen aus stayingclean/ki-tasks (siehe unten). Nach
  # jedem Deploy dort schickt ki-tasks ein repository_dispatch hierher. Das
  # Token dafuer stellt eine GitHub App aus, die nur auf diesem Repo installiert
  # ist (Contents: write); ihr Schluessel laeuft nicht ab, anders als ein PAT.
  # Der Workflow muss dafuer auf master liegen.
  repository_dispatch:
    types: [ki-tasks]
  # Reserve, falls der Dispatch ausbleibt (App fehlt, Secret falsch). Achtung:
  # GitHub schaltet geplante Laeufe in oeffentlichen Repos nach 60 Tagen ohne
  # Commit ab; der Dispatch haelt die Seiten trotzdem aktuell.
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # Die Seiten, die den ki-tasks-Ordner beschreiben, liegen in jenem Repo,
      # weil sie sich mit ihm zusammen aendern muessen. ki-tasks ist oeffentlich,
      # darum braucht dieser Checkout kein Token.
      - name: Anleitung aus ki-tasks holen
        uses: actions/checkout@v4
        with:
          repository: stayingclean/ki-tasks
          path: _ki-tasks

      # Der Ordner anleitung/ entsteht erst in einem spaeteren Durchgang drueben.
      # Solange er fehlt, laeuft das Deployment mit den Toolbox-Seiten weiter,
      # statt an einem `cp` ohne Quelle zu scheitern.
      - name: Einsetzen
        run: |
          if [ -d _ki-tasks/anleitung ]; then
            cp -r _ki-tasks/anleitung/. docs/claude-anleitung/
            echo "Anleitungsseiten aus ki-tasks uebernommen:"
            ls -1 _ki-tasks/anleitung
            # Navigation und Karten der Aufgaben aus der Namenskonvention
            # aufgaben/<name>/INFO.md + anleitung/<name>.html. Bricht ab, wenn
            # eine Seite sonst unerreichbar waere.
            python3 tools/anleitung_aufgaben.py _ki-tasks docs/claude-anleitung
          else
            echo "::notice::_ki-tasks/anleitung fehlt noch - nur die Toolbox-Seiten werden veroeffentlicht."
          fi

      # _ki-tasks liegt im Wurzelverzeichnis, hochgeladen wird nur ./docs.
      # Der Checkout kann also nicht ins Artefakt geraten; die Zeile prueft es.
      - name: Pruefen, dass _ki-tasks nicht im Artefakt liegt
        run: |
          if find docs -name '_ki-tasks' -print -quit | grep -q .; then
            echo "::error::_ki-tasks liegt unter docs/ und wuerde veroeffentlicht."
            exit 1
          fi
          echo "OK: docs/ enthaelt kein _ki-tasks."

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
